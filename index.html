<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 导航 - 常用 AI 工具链接</title>
<style>
  :root {
    --bg: #0c0c18;
    --card: #151528;
    --card-hover: #1c1c38;
    --border: #252545;
    --text: #e0e0f0;
    --muted: #8888aa;
    --accent1: #6366f1;
    --accent2: #a855f7;
    --accent3: #ec4899;
    --glow: rgba(99,102,241,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }
  body::before {
    content: '';
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: radial-gradient(ellipse at 20% 0%, rgba(99,102,241,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(236,72,153,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* Header */
  header {
    text-align: center;
    padding: 60px 0 30px;
  }
  header h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  header p {
    color: var(--muted);
    font-size: 15px;
  }

  /* Search */
  .search-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 36px;
  }
  .search-box {
    position: relative;
    width: 100%;
    max-width: 500px;
  }
  .search-box input {
    width: 100%;
    padding: 14px 20px 14px 48px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .search-box input:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px var(--glow);
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box .icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--muted);
  }

  /* Categories */
  .cats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 36px;
  }
  .cats button {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.25s;
  }
  .cats button:hover { border-color: var(--accent2); color: var(--text); }
  .cats button.active {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border-color: transparent;
    color: #fff;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    padding-bottom: 60px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 0;
    border-radius: 14px;
  }
  .card:hover {
    border-color: var(--accent2);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(99,102,241,0.15);
  }
  .card:hover::after { opacity: 0.06; }
  .card .emoji {
    font-size: 32px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .card .info {
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 1;
  }
  .card .info h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card .info .desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .info .domain {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 6px;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 30px 0 50px;
    color: var(--muted);
    font-size: 13px;
    position: relative;
    z-index: 1;
  }
  footer a { color: var(--accent2); text-decoration: none; }

  /* No results */
  .no-results {
    text-align: center;
    grid-column: 1 / -1;
    padding: 60px 0;
    color: var(--muted);
    font-size: 16px;
  }

  /* Mobile */
  @media (max-width: 640px) {
    header h1 { font-size: 30px; }
    header { padding: 40px 0 20px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  { emoji:'🛠', name:'Dify', desc:'开源LLM应用开发平台', url:'https://dify.ai', cat:'tools', domain:'dify.ai' },

const categories = [
  { key:'all', emoji:'🏠', label:'全部' },
  { key:'chat', emoji:'🤖', label:'AI对话' },
  { key:'image', emoji:'🎨', label:'AI绘画' },
  { key:'video', emoji:'🎬', label:'AI视频' },
  { key:'code', emoji:'💻', label:'AI编程' },
  { key:'search', emoji:'🔍', label:'AI搜索' },
  { key:'music', emoji:'🎵', label:'AI音乐' },
  { key:'tools', emoji:'🛠', label:'AI工具' },
];

let activeCat = 'all';

function renderCats() {
  let h = '';
  categories.forEach(c => {
    h += `<button class="${c.key===activeCat?'active':''}" data-cat="${c.key}">${c.emoji} ${c.label}</button>`;
  });
  document.getElementById('cats').innerHTML = h;
}

function renderCards(filter = '') {
  const grid = document.getElementById('grid');
  let items = links;
  if (activeCat !== 'all') items = items.filter(l => l.cat === activeCat);
  if (filter) {
    const q = filter.toLowerCase();
    items = items.filter(l => l.name.toLowerCase().includes(q) || l.desc.toLowerCase().includes(q) || l.domain.toLowerCase().includes(q));
  }
  if (items.length === 0) {
    grid.innerHTML = '<div class="no-results">😕 没找到匹配的 AI 工具，试试换个关键词？</div>';
    return;
  }
  let h = '';
  items.forEach(l => {
    h += `
      <a class="card" href="${l.url}" target="_blank" rel="noopener">
        <span class="emoji">${l.emoji}</span>
        <div class="info">
          <h3>${l.name}</h3>
          <div class="desc">${l.desc}</div>
          <div class="domain">${l.domain}</div>
        </div>
      </a>`;
  });
  grid.innerHTML = h;
}

// Category clicks
document.getElementById('cats').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
    const btn = e.target.closest('button');
    activeCat = btn.dataset.cat;
    renderCats();
    renderCards(document.getElementById('search').value);
  }
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
  if (e.target.value && activeCat !== 'all') {
    activeCat = 'all';
    renderCats();
  }
  renderCards(e.target.value);
});

// Init
renderCats();
renderCards();
</script>

</body>
</html>
